<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{hoist "head"}}
  <link rel="stylesheet" href="{{asset "/static/app.css"}}">
  <link rel="stylesheet" href="{{asset "/static/chroma.css"}}">
  <link rel="icon" href="{{asset "/static/favicon.svg"}}" type="image/svg+xml">
  <script src="{{asset "/static/search.js"}}" defer></script>
</head>

<body>
  <header class="site-header">
    <a class="brand" href="{{pageURL "home"}}">
      <img src="{{asset "/static/favicon.svg"}}" width="26" height="26" alt="">
      <span>collage</span>
    </a>
    <div class="search" id="search" data-index="{{pageURL "search"}}">
      <input type="search" placeholder="Search the docs" aria-label="Search the documentation"
        role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list"
        autocomplete="off" spellcheck="false">
      <kbd aria-hidden="true">/</kbd>
      <ul id="search-results" role="listbox" aria-label="Results" hidden></ul>
    </div>
    <nav class="site-nav" aria-label="Site">
      <a href="{{pageURL "doc" "slug" "introduction"}}">Docs</a>
      <a href="https://pkg.go.dev/github.com/Elagoht/collage/pkg/collage">Go reference <span aria-hidden="true">↗</span></a>
      <a href="https://github.com/Elagoht/collage">GitHub</a>
    </nav>
  </header>

  {{slot "content"}}

  <footer class="site-footer">
    <p>collage is MIT-licensed. These pages are a collage site, exported to static files.</p>
  </footer>
</body>

</html>
