<!doctype html>
<html lang="{{.Lang}}">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{hoist "head"}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&display=swap">
  <link rel="stylesheet" href="{{asset "/static/app.css"}}">
  <script src="{{asset "/static/site.js"}}" defer></script>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{pageURL "home"}}">
        <img src="{{asset "/static/favicon.svg"}}" width="40" height="40" alt="">
        <span class="brand-text">
          <strong>collage</strong>
        </span>
      </a>

      {{searchBox}}

      <input class="menu-toggle" id="menu-toggle" type="checkbox">
      <label class="burger" for="menu-toggle">
        <span class="visually-hidden">{{t "nav.menu"}}</span>
        <i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i>
      </label>
      <nav class="site-nav" aria-label="{{t "nav.label"}}">
        <a href="{{pageURL "doc" "slug" "introduction"}}"{{if eq .Section "docs"}} aria-current="true"{{end}}>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1zM10 5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1zM5 8h5M10 16h5M15.7 5.3l2.6-.6a1 1 0 0 1 1.2.7l3 13.4a1 1 0 0 1-.7 1.2l-2.6.6a1 1 0 0 1-1.2-.7l-3-13.4a1 1 0 0 1 .7-1.2z" /></svg>
          {{t "nav.docs"}}
        </a>
        <a href="https://pkg.go.dev/github.com/Elagoht/collage/pkg/collage">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8l-4 4 4 4M17 8l4 4-4 4M14 4l-4 16" /></svg>
          {{t "nav.goReference"}}
        </a>
        <a href="https://github.com/Elagoht/collage">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21" /></svg>
          GitHub
        </a>
        <div class="languages" role="group" aria-label="{{t "language.label"}}">
          {{range .Languages}}
          {{if .Current}}<span class="language" aria-current="true" lang="{{.Code}}" title="{{.Name}}">{{else}}<a class="language" href="{{.URL}}" hreflang="{{.Code}}" lang="{{.Code}}" title="{{.Name}}">{{end}}
            {{if eq .Code "tr"}}<svg class="flag" viewBox="0 0 30 20" aria-hidden="true"><path d="M0 0h30v20H0z" fill="#E30A17" /><circle cx="11.25" cy="10" r="5" fill="#fff" /><circle cx="12.5" cy="10" r="4" fill="#E30A17" /><path d="M14.4 10l5.4 1.75-3.34-4.6v5.7l3.34-4.6z" fill="#fff" /></svg>{{else}}<svg class="flag" viewBox="0 0 60 30" aria-hidden="true"><clipPath id="flag-uk-{{$.Lang}}"><path d="M0 0v30h60V0z" /></clipPath><clipPath id="flag-uk-t-{{$.Lang}}"><path d="M30 15h30v15zv15H0zH0V0zV0h30z" /></clipPath><g clip-path="url(#flag-uk-{{$.Lang}})"><path d="M0 0v30h60V0z" fill="#012169" /><path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6" /><path d="M0 0l60 30m0-30L0 30" clip-path="url(#flag-uk-t-{{$.Lang}})" stroke="#C8102E" stroke-width="4" /><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10" /><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6" /></g></svg>{{end}}
            <span class="language-code">{{.Code}}</span>
          {{if .Current}}</span>{{else}}</a>{{end}}
          {{end}}
        </div>
      </nav>
    </div>
  </header>

  {{slot "content"}}

  <footer class="site-footer">
    <div class="footer-inner">
      <p>
        <img src="{{asset "/static/favicon.svg"}}" width="20" height="20" alt="">
        {{t "footer.text"}}
      </p>
      <nav aria-label="{{t "footer.links"}}">
        <a href="https://github.com/Elagoht/collage">GitHub</a>
        <a href="https://pkg.go.dev/github.com/Elagoht/collage/pkg/collage">{{t "nav.goReference"}}</a>
      </nav>
    </div>
  </footer>
</body>

</html>
